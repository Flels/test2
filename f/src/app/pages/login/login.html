<mat-card appearance="outlined" class="auth-karte">
  <mat-card-header><mat-card-title>Anmelden</mat-card-title></mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="anmelden()" novalidate>
      <mat-form-field class="volle-breite">
        <mat-label>E-Mail-Adresse</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error>Bitte gültige E-Mail-Adresse eingeben</mat-error>
      </mat-form-field>
      <mat-form-field class="volle-breite">
        <mat-label>Passwort</mat-label>
        <input matInput type="password" formControlName="passwort" autocomplete="current-password" />
        <mat-error>Bitte Passwort eingeben</mat-error>
      </mat-form-field>
      @if (fehler()) {
        <p class="fehlermeldung" role="alert">{{ fehler() }}</p>
      }
      <button mat-flat-button type="submit" class="volle-breite">Anmelden</button>
    </form>
    <p class="wechsel">Noch kein Konto? <a routerLink="/registrieren">Jetzt registrieren</a></p>
  </mat-card-content>
</mat-card>
